plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.asorichetti.myshelf.textrecognition'
version = '1.0.0'

android {
  namespace "dev.asorichetti.myshelf.textrecognition"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ML Kit Text Recognition v2, Latin script, with the model bundled in the
  // APK: it works offline from the first launch and needs no Google Play
  // services download (docs/release.md has the size it adds).
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}
