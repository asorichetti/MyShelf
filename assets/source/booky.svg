<svg xmlns="http://www.w3.org/2000/svg" width="120" height="170" viewBox="0 0 120 170">
  <!--
    Booky, happy, in the light theme's colours: the artwork of
    src/components/booky/Booky.tsx (120x170) with the tokens from
    src/theme/tokens.ts filled in. The icon, splash and store graphics in this
    folder all copy this group; change them together.
  -->
  <g id="booky">
    <!-- Tassel cord and bead (accent) -->
    <path d="M60 18 C 60 8, 70 3, 76 9" stroke="#A8336B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="77" cy="11" r="4.5" fill="#A8336B"/>
    <!-- Ribbon body with notched tail (bookyBody) -->
    <path d="M24 26 Q24 17 33 17 H87 Q96 17 96 26 V160 L60 134 L24 160 Z" fill="#7B4FB8"/>
    <!-- Right-hand fold shading (bookyShade) -->
    <path d="M84 17 H87 Q96 17 96 26 V160 L84 151 Z" fill="#512F82" opacity="0.45"/>
    <!-- Ribbon stitching (bookyStitch) -->
    <path d="M31 26 V148 M89 26 V148" stroke="#D9C7F0" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8" fill="none"/>
    <!-- Eyes (bookyEye, bookyPupil) -->
    <ellipse cx="46" cy="60" rx="11" ry="12.5" fill="#FFFFFF"/>
    <circle cx="46" cy="61" r="6.5" fill="#2A1846"/>
    <circle cx="48.5" cy="58" r="2.4" fill="#FFFFFF"/>
    <ellipse cx="74" cy="60" rx="11" ry="12.5" fill="#FFFFFF"/>
    <circle cx="74" cy="61" r="6.5" fill="#2A1846"/>
    <circle cx="76.5" cy="58" r="2.4" fill="#FFFFFF"/>
    <!-- Rosy cheeks (bookyCheek) -->
    <g opacity="0.85">
      <ellipse cx="37" cy="79" rx="6.5" ry="3.8" fill="#F4A6C6"/>
      <ellipse cx="83" cy="79" rx="6.5" ry="3.8" fill="#F4A6C6"/>
    </g>
    <!-- Smile -->
    <path d="M51 79 Q60 88 69 79" stroke="#2A1846" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
