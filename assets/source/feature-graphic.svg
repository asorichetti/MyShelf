<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Google Play feature graphic (1024x500). Booky on a lavender wall above a
    brass-edged shelf of spines, with the wordmark and a one-line pitch.
    Text is kept away from the edges, as Play may crop or overlay them.
    Fonts: Lora 700 and Nunito 600, loaded by scripts/render-icons.mjs.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1FC"/>
      <stop offset="1" stop-color="#D9C7F0"/>
    </linearGradient>
    <g id="booky">
      <!-- Tassel cord and bead (accent) -->
      <path d="M60 18 C 60 8, 70 3, 76 9" stroke="#A8336B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="77" cy="11" r="4.5" fill="#A8336B"/>
      <!-- Ribbon body with notched tail (bookyBody) -->
      <path d="M24 26 Q24 17 33 17 H87 Q96 17 96 26 V160 L60 134 L24 160 Z" fill="#7B4FB8"/>
      <!-- Right-hand fold shading (bookyShade) -->
      <path d="M84 17 H87 Q96 17 96 26 V160 L84 151 Z" fill="#512F82" opacity="0.45"/>
      <!-- Ribbon stitching (bookyStitch) -->
      <path d="M31 26 V148 M89 26 V148" stroke="#D9C7F0" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8" fill="none"/>
      <!-- Eyes (bookyEye, bookyPupil) -->
      <ellipse cx="46" cy="60" rx="11" ry="12.5" fill="#FFFFFF"/>
      <circle cx="46" cy="61" r="6.5" fill="#2A1846"/>
      <circle cx="48.5" cy="58" r="2.4" fill="#FFFFFF"/>
      <ellipse cx="74" cy="60" rx="11" ry="12.5" fill="#FFFFFF"/>
      <circle cx="74" cy="61" r="6.5" fill="#2A1846"/>
      <circle cx="76.5" cy="58" r="2.4" fill="#FFFFFF"/>
      <!-- Rosy cheeks (bookyCheek) -->
      <g opacity="0.85">
        <ellipse cx="37" cy="79" rx="6.5" ry="3.8" fill="#F4A6C6"/>
        <ellipse cx="83" cy="79" rx="6.5" ry="3.8" fill="#F4A6C6"/>
      </g>
      <!-- Smile -->
      <path d="M51 79 Q60 88 69 79" stroke="#2A1846" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <rect width="1024" height="500" fill="url(#wall)"/>
  <circle cx="282" cy="236" r="176" fill="#FFFDF8" opacity="0.6"/>
  <!-- Shelf: spines in the app's palette, standing on a brass edge -->
  <g>
    <rect x="-10" y="444" width="1044" height="70" fill="#512F82"/>
    <rect x="-10" y="436" width="1044" height="12" rx="3" fill="#D9B97A"/>
    <rect x="-10" y="446" width="1044" height="3" fill="#B08D57"/>
  </g>
  <g>
    <rect x="600" y="372" width="30" height="64" rx="3" fill="#6B3FA8"/>
    <rect x="632" y="356" width="24" height="80" rx="3" fill="#A8336B"/>
    <rect x="658" y="380" width="34" height="56" rx="3" fill="#3D2363"/>
    <rect x="694" y="362" width="22" height="74" rx="3" fill="#9B74CF"/>
    <rect x="718" y="376" width="28" height="60" rx="3" fill="#2D6B45"/>
    <rect x="748" y="352" width="26" height="84" rx="3" fill="#512F82"/>
    <rect x="776" y="368" width="32" height="68" rx="3" fill="#D9B97A"/>
    <rect x="810" y="358" width="22" height="78" rx="3" fill="#6F1C45"/>
    <rect x="834" y="386" width="36" height="50" rx="3" fill="#BFA3E3"/>
    <rect x="872" y="364" width="26" height="72" rx="3" fill="#7B4FB8"/>
    <rect x="900" y="374" width="30" height="62" rx="3" fill="#1D3F5E"/>
    <!-- a leaning book -->
    <rect x="936" y="372" width="24" height="70" rx="3" fill="#A8336B" transform="rotate(14 936 442)"/>
    <!-- brass rules across the spines -->
    <g fill="#D9B97A" opacity="0.8">
      <rect x="600" y="384" width="30" height="3"/>
      <rect x="658" y="392" width="34" height="3"/>
      <rect x="748" y="366" width="26" height="3"/>
      <rect x="872" y="378" width="26" height="3"/>
    </g>
  </g>
  <use href="#booky" transform="translate(126 20) scale(2.6)"/>
  <text x="420" y="196" font-family="Lora" font-weight="700" font-size="96" fill="#3D2363">MyShelf</text>
  <text x="424" y="252" font-family="Nunito" font-weight="600" font-size="30" fill="#4A3F5C">Your home library, catalogued with care.</text>
  <text x="424" y="296" font-family="Nunito" font-weight="600" font-size="24" fill="#6B3FA8">Scan · Shelve · Lend · Find</text>
</svg>
