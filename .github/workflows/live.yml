name: Live APIs

# Checks the real Open Library APIs still give well-known books real cover art
# (npm run test:live). Scheduled rather than on every push: it depends on an
# outside service, and a failure here means the API or its data changed, not
# that a commit broke something.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  covers:
    name: Real covers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - name: Resolve covers for well-known books
        env:
          LIVE_COVERS_OUT: live-covers
        run: npm run test:live
      - name: Upload the chosen covers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-covers
          path: live-covers/
          if-no-files-found: ignore
          retention-days: 7
