name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      # selectors:check (generated testids in sync), typecheck, jest
      - run: npm run check

  auto-test-suite:
    name: auto-test-suite smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only on a cache miss; always installs its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Typecheck the tool and run its unit tests.
      - run: npm run autotest:check
      - name: Start Expo web server
        run: |
          CI=1 npx expo start --web --port 8081 > expo-web.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:8081/ > /dev/null; then echo "Expo web is up"; exit 0; fi
            sleep 1
          done
          echo "Expo web did not start"; cat expo-web.log; exit 1
      # The dev server writes Expo Router's typed routes (.expo/types), so this
      # typecheck is strict about route links, unlike the one in the app job.
      - name: Typecheck with generated route types
        run: npm run typecheck
      - name: Smoke (core suite, gates fail)
        run: npm run -s autotest -- smoke --env local --ux-gates fail --headless=true
      - name: Remaining journeys (gates fail)
        run: npm run -s autotest -- journey --suite responsive --ux-gates fail --headless=true
      - name: Upload evidence bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-test-suite-screenshots
          path: |
            screenshots/
            expo-web.log
          if-no-files-found: warn
          retention-days: 14
