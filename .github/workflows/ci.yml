name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      # selectors:check (generated testids in sync), typecheck, jest
      - run: npm run check

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so the pushed range and the pull request's base exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs .githooks/commit-msg on every commit message in the pull request
      # or the pushed range, so a commit made without the hook enabled is
      # still caught. The script handles the first push of a branch (before
      # is all zeros) and force pushes (before is not an ancestor).
      - name: Check commit messages with the commit-msg hook
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-commit-messages.sh "$BASE" "$HEAD_SHA"

  auto-test-suite:
    name: auto-test-suite smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only on a cache miss; always installs its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Typecheck the tool and run its unit tests.
      - run: npm run autotest:check
      # Every gate rule fires on a deliberately broken fixture page.
      - name: Gate self-tests
        run: npm run autotest:selftest
      # Expo Router's typed routes (.expo/types/router.d.ts) are only written by
      # the dev server; `expo export` does not generate them. Start it just long
      # enough to write them, then stop it: the journeys run against the export.
      - name: Generate typed routes
        run: |
          CI=1 npx expo start --web --port 8081 > expo-web.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if [ -s .expo/types/router.d.ts ] && curl -sf http://localhost:8081/ > /dev/null; then break; fi
            sleep 1
          done
          kill "$pid" || true
          wait "$pid" 2> /dev/null || true
          if [ ! -s .expo/types/router.d.ts ]; then echo "Typed routes were not generated"; cat expo-web.log; exit 1; fi
      # With the route types present this typecheck is strict about route
      # links, unlike the one in the app job.
      - name: Typecheck with generated route types
        run: npm run typecheck
      # The journeys run against the static export served by --serve (SPA
      # fallback, COOP/COEP, real 404s for missing assets): the shipped bundle,
      # not the dev server's.
      - name: Export the web build
        run: npm run export:web > expo-export.log 2>&1 || { cat expo-export.log; exit 1; }
      - name: Smoke (core suite, gates fail)
        run: npm run -s autotest -- smoke --serve dist --ux-gates fail --headless=true
      # Every other journey, whatever suite it is in (responsive, p00, p01, ...),
      # so a journey in a new suite runs without a workflow change.
      - name: Every other journey (gates fail)
        run: npm run -s autotest -- journey --all --exclude-suite core --serve dist --ux-gates fail --headless=true
      - name: Upload evidence bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-test-suite-screenshots
          path: |
            screenshots/
            expo-web.log
            expo-export.log
          if-no-files-found: warn
          retention-days: 14
