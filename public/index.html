<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Web template for `web.output: "single"` (Expo Router's +html.tsx is only
      used for static/server output). Design tokens are written onto :root as
      --ms-* custom properties at runtime by ThemeProvider; the fallbacks below
      only cover the moment before the bundle runs.
    -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      html {
        /* Each weight is its own font file; never fake bold/italic on top. */
        font-synthesis: none;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family: var(--ms-font-body, system-ui), system-ui, sans-serif;
        background-color: var(--ms-color-paper, #FBF6EC);
        color: var(--ms-color-ink, #271D38);
      }
      @media (prefers-color-scheme: dark) {
        /* The dark theme's paper and ink, so a dark browser does not flash white first. */
        body {
          background-color: var(--ms-color-paper, #1C1424);
          color: var(--ms-color-ink, #F1E8DC);
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run MyShelf.</noscript>
    <div id="root"></div>
  </body>
</html>
