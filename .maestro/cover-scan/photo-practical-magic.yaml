# Cover scan from a gallery photo (P03-05, P03-06): "Practical Magic". Needs an E2E build
# (the searches answer from recorded responses) and the photo at .maestro/cover-scan/photos/practical-magic.jpg, made with
# scripts/prepare-test-photo.swift (git-ignored; see .maestro/cover-scan/README.md).
appId: dev.asorichetti.myshelf
tags:
  - cover-scan
  - needs-photos
---
- addMedia:
    - photos/practical-magic.jpg
- runFlow:
    file: read-photo.yaml
    env:
      TITLE: "Practical Magic"
      SHOT: cover-scan-practical-magic
